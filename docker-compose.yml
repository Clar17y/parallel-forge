services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data

volumes:
  forge-postgres-data:
